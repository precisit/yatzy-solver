[workspace]
resolver = "3"
members = ["crates/yatzy-solver", "crates/yatzy-solver-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/precisit/yatzy-solver"
rust-version = "1.85"

[profile.release]
codegen-units = 1
lto = "thin"

# The cross-check tests do heavy arithmetic; optimize them.
[profile.test]
opt-level = 3
