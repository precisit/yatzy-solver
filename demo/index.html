<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Optimal Yatzy advisor</title>
  <meta name="description" content="Every option in Yatzy with its exact expected score and the points it loses against the best.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='3' fill='%23355c7d'/%3E%3Ccircle cx='5' cy='5' r='1.5' fill='white'/%3E%3Ccircle cx='11' cy='11' r='1.5' fill='white'/%3E%3Ccircle cx='8' cy='8' r='1.5' fill='white'/%3E%3C/svg%3E">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <h1 id="title">Optimal Yatzy advisor</h1>
    <button id="lang" class="link" type="button">Svenska</button>
  </header>
  <main>
    <p id="intro" class="lead"></p>
    <div class="bar">
      <label><span id="variant-label">Rules</span> <select id="variant"></select></label>
      <span id="status" class="muted" role="status"></span>
    </div>
    <div class="grid">
      <section aria-labelledby="dice-title">
        <h2 id="dice-title">Dice</h2>
        <p id="dice-help" class="muted"></p>
        <div id="dice" class="dice"></div>
        <div class="bar">
          <button id="roll" type="button">Roll all</button>
          <span><span id="rolls-label">Rerolls left</span> <span id="rolls" class="segs"></span></span>
        </div>
        <h2 id="options-title">Options</h2>
        <p id="options-help" class="muted"></p>
        <div id="options" aria-live="polite"></div>
        <button id="new-game" type="button" class="link">New game</button>
      </section>
      <section aria-labelledby="card-title">
        <h2 id="card-title">Score card</h2>
        <p id="card-help" class="muted"></p>
        <table class="card"><tbody id="card"></tbody></table>
      </section>
    </div>
    <p id="note" class="muted small"></p>
  </main>
</body>
</html>
