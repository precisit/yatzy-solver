[package]
name = "yatzy-solver-wasm"
description = "WebAssembly bindings for yatzy-solver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
yatzy-solver = { path = "../../crates/yatzy-solver", default-features = false }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
