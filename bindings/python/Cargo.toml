[package]
name = "yatzy-solver-python"
description = "Python bindings for yatzy-solver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_yatzy_solver"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py39"] }
yatzy-solver = { path = "../../crates/yatzy-solver", features = ["parquet"] }
