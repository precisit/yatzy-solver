[package]
name = "yatzy-solver-cli"
description = "Command-line interface for yatzy-solver: build tables, query situations, verify the published values"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["yatzy", "dice", "solver", "cli"]
categories = ["games", "command-line-utilities"]

[[bin]]
name = "yatzy-solver"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
num-rational = "0.4"
num-traits = "0.2"
serde_json = { version = "1", features = ["float_roundtrip"] }
yatzy-solver = { path = "../yatzy-solver", version = "1.0.0", features = ["verify", "parquet"] }
