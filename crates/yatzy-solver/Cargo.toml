[package]
name = "yatzy-solver"
description = "Exact solver, rules engine and notation for Scandinavian Yatzy and American rules (Yahtzee-compatible)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/yatzy-solver"
keywords = ["yatzy", "dice", "solver", "dynamic-programming", "game"]
categories = ["games", "algorithms", "simulation"]
exclude = ["tests/", "examples/"]

[package.metadata.docs.rs]
features = ["verify", "parquet"]

[features]
default = ["parallel"]
# Solve layers on all cores.
parallel = ["dep:rayon"]
# Exact rational arithmetic and the brute-force reference solver.
verify = ["dep:num-bigint", "dep:num-rational", "dep:num-traits"]
# Parquet output for the export.
parquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema"]

[dependencies]
arrow-array = { version = "60", optional = true }
arrow-schema = { version = "60", optional = true }
parquet = { version = "60", optional = true, default-features = false, features = ["arrow", "zstd"] }
num-bigint = { version = "0.4", optional = true }
num-rational = { version = "0.4", optional = true }
num-traits = { version = "0.2", optional = true }
rayon = { version = "1", optional = true }
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
num-rational = "0.4"
num-traits = "0.2"
serde_json = { version = "1", features = ["float_roundtrip"] }
bytes = "1"
