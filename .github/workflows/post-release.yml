name: Post-release check

# After a release is published: install every package from its registry (not from source) on Linux, macOS and
# Windows, and run the golden set through each. Run it by hand with the version to check.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The published version to check, e.g. 1.0.0"
        required: true
  pull_request:
    paths:
      - ".github/workflows/post-release.yml"

permissions:
  contents: read

jobs:
  installs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version || '1.0.0' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The checkout provides the golden set and the test scripts only; nothing is built from it.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable

      - name: pip install from PyPI - tests and golden set
        run: |
          python -m pip install -q "yatzy-solver==$VERSION" pytest pyarrow
          python -c "import yatzy_solver as ys; print(ys.__version__, ys.__file__); assert ys.__version__ == '$VERSION'"
          python -m pytest -q bindings/python/tests

      - name: npm install from the registry - golden set
        run: |
          mkdir "$RUNNER_TEMP/npmcheck" && cd "$RUNNER_TEMP/npmcheck"
          npm init -y > /dev/null
          npm install "yatzy-solver@$VERSION"
          cp "$GITHUB_WORKSPACE/bindings/wasm/tests/parity.mjs" .
          YATZY_SOLVER_MODULE=yatzy-solver GOLDEN="$GITHUB_WORKSPACE/golden/parity.jsonl" node parity.mjs

      - name: cargo install from crates.io - verify with the golden set
        run: |
          cargo install yatzy-solver-cli --version "$VERSION" --locked --root "$RUNNER_TEMP/cli"
          "$RUNNER_TEMP/cli/bin/yatzy-solver" --version
          "$RUNNER_TEMP/cli/bin/yatzy-solver" verify --golden golden/parity.jsonl

      - name: cargo add from crates.io - a consumer crate
        run: |
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          cargo init --name consumer --vcs none -q
          cargo add "yatzy-solver@=$VERSION" -q
          cat > src/main.rs <<'RS'
          fn main() {
              let v = yatzy_solver::Variant::scandinavian();
              let s = yatzy_solver::Solver::build(&v);
              let x = s.state_value(&yatzy_solver::State::new());
              println!("yatzy-scandinavian {x:.10}");
              assert_eq!(format!("{x:.7}"), "248.4399894");
          }
          RS
          cargo run --release -q

      - name: Release assets - tables match the published hashes; the CLI binary runs
        run: |
          mkdir "$RUNNER_TEMP/assets" && cd "$RUNNER_TEMP/assets"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY"
          sha256sum -c tables.sha256
          case "$RUNNER_OS" in
            Linux) bin=yatzy-solver-x86_64-linux ;;
            macOS) bin=yatzy-solver-aarch64-macos ;;
            Windows) bin=yatzy-solver-x86_64-windows.exe ;;
          esac
          chmod +x "$bin"
          "./$bin" --version
          "./$bin" query --table yatzy-scandinavian.f32.yzt "dice 1 3 3 5 6 | rolls 2 | upper 0 | filled -" | head -3

  docs-rs:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || '1.0.0' }}
    steps:
      - name: docs.rs built the documentation
        run: |
          # A new release waits in the docs.rs queue first: poll for up to 30 minutes.
          for i in $(seq 1 60); do
            code=$(curl -sS -o builds.json -w '%{http_code}' "https://docs.rs/crate/yatzy-solver/$VERSION/builds.json")
            if [ "$code" = 200 ] && python3 -c "import json,sys; b=json.load(open('builds.json')); sys.exit(0 if b and b[0]['build_status'] in ('success','failure') else 1)"; then break; fi
            echo "not built yet (HTTP $code), waiting"; sleep 30
          done
          cat builds.json
          python3 -c "import json; b=json.load(open('builds.json')); assert b and b[0]['build_status'] == 'success', b"
