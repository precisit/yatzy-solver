name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: cargo test --doc --all-features
      # The library alone, as the Python and WASM bindings will build it.
      - run: cargo build -p yatzy-solver --no-default-features

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo clippy -p yatzy-solver-python -- -D warnings
      - run: pip install maturin numpy pytest pyarrow
      - run: maturin build --release -m bindings/python/Cargo.toml -o dist
      - run: pip install --no-index --find-links dist yatzy-solver
      - run: pytest -q bindings/python/tests

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cargo clippy -p yatzy-solver-wasm --target wasm32-unknown-unknown -- -D warnings
      # Pinned, and cached between runs, so a new wasm-pack release cannot change a build silently.
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.15.0-${{ runner.os }}
      - run: command -v wasm-pack || cargo install wasm-pack --locked --version 0.15.0
      - run: wasm-pack --version | grep -q "0.15.0"
      - run: wasm-pack build bindings/wasm --release --target web --out-dir pkg --out-name yatzy_solver
      - run: node bindings/wasm/scripts/package.mjs
      - run: node bindings/wasm/tests/parity.mjs
